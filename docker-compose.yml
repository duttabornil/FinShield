services:
  db:
    image: postgres:16-alpine
    container_name: finshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finshield
      POSTGRES_PASSWORD: finshield
      POSTGRES_DB: finshield
    ports:
      - "5432:5432"
    volumes:
      - finshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finshield -d finshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finshield_pgdata:
